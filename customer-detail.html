<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Detail Screen</title>

    <link rel="stylesheet" href="customer-detail.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <h2>iFinance</h2>
    </header>

    <div class="container">

        <!-- Action Buttons -->
        <div class="action-bar">
            <button onclick="window.location.href='out-payments.html'">Out Payment</button>
            <button>Hand Loans</button>
            <button onclick="window.location.href='emi-reports.html'">EMI Reports</button>
            <button>RMD</button>
            <button>SHD</button>
            <button>Receipt</button>
        </div>

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            Finance's / Finance Details
        </div>

        <!-- Customer Name -->
        <div class="customer-header">
            <h2>GOLLAPALLI JEEVA</h2>

            <button class="search-btn">
                <i class="fa-solid fa-house"></i>
                Search
            </button>
        </div>

        <!-- Vehicle Details -->
        <div class="card">

            <div class="card-header active" onclick="toggleSection('vehicleSection')">
                Vehicle Details
                <i class="fa-solid fa-chevron-down"></i>
            </div>

            <div class="card-body show" id="vehicleSection">

                <div class="grid">

                    <div>
                        <label>HP #</label>
                        <input type="text" value="TYRE0025">
                    </div>

                    <div>
                        <label>Reg No</label>
                        <input type="text" value="825-20 FIFTY PLAS R">
                    </div>

                    <div>
                        <label>Maker</label>
                        <input type="text" value="MRF">
                    </div>

                    <div>
                        <label>Model</label>
                        <input type="text" value="2026">
                    </div>

                    <div>
                        <label>Chasis No</label>
                        <input type="text" value="ASDF">
                    </div>

                    <div>
                        <label>Engine No</label>
                        <input type="text" value="ASDF">
                    </div>

                    <div>
                        <label>HP Date</label>
                        <input type="date" value="2026-06-29">
                    </div>

                    <div>
                        <label>EMI Date</label>
                        <input type="date" value="2026-08-05">
                    </div>

                    <div>
                        <label>Seized</label>
                        <select>
                            <option>No</option>
                            <option>Yes</option>
                        </select>
                    </div>

                    <div>
                        <label>Closed</label>
                        <select>
                            <option>No</option>
                            <option>Yes</option>
                        </select>
                    </div>

                </div>

                <div class="bottom-actions">
                    <button>Seized</button>
                    <button>Closed</button>
                    <button>AP Transport Search</button>
                </div>

            </div>
        </div>

        <!-- Finance Information -->
        <div class="card">

            <div class="card-header" onclick="toggleSection('financeSection')">

                Finance Information
                <i class="fa-solid fa-chevron-down"></i>

            </div>

            <div class="card-body" id="financeSection">

                <p>Total Amount : ₹ 500000</p>
                <p>Paid Amount : ₹ 150000</p>
                <p>Balance Amount : ₹ 350000</p>

            </div>

        </div>

        <!-- Communications -->
        <div class="card">

            <div class="card-header" onclick="toggleSection('communicationSection')">

                Communications
                <i class="fa-solid fa-chevron-down"></i>

            </div>

            <div class="card-body" id="communicationSection">

                <textarea rows="5" placeholder="Communication notes"></textarea>

            </div>

        </div>

        <!-- Attachments -->
        <div class="card">

            <div class="card-header" onclick="toggleSection('attachmentSection')">

                Attachments
                <i class="fa-solid fa-chevron-down"></i>

            </div>

            <div class="card-body" id="attachmentSection">

                <input type="file">

            </div>

        </div>

        <!-- Update Button -->
        <div class="update-section">
            <button class="update-btn">Update</button>
        </div>

    </div>

    <footer>
        © 2026 iFinance Management System
    </footer>

    <script src="customer-detail.js"></script>

</body>

</html>
